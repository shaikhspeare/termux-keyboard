name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "helium314.keyboard.terminal.*"

      - name: Decode sideload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TERMUX_KEYBOARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key in secrets; building the debug APK (not update-safe)."
          fi

      - name: Build signed release
        if: steps.keystore.outputs.signed == 'true'
        env:
          TERMUX_KEYBOARD_KEYSTORE: ${{ runner.temp }}/sideload.jks
          TERMUX_KEYBOARD_KEYSTORE_PASSWORD: ${{ secrets.TERMUX_KEYBOARD_KEYSTORE_PASSWORD }}
          TERMUX_KEYBOARD_KEY_ALIAS: ${{ secrets.TERMUX_KEYBOARD_KEY_ALIAS }}
          TERMUX_KEYBOARD_KEY_PASSWORD: ${{ secrets.TERMUX_KEYBOARD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Build debug
        if: steps.keystore.outputs.signed != 'true'
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: termux-keyboard-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/*/*.apk
